{{define "content"}}
<h2>Список трат</h2>

{{if .Expenses}}
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Сумма</th>
            <th>Описание</th>
            <th>Дата</th>
        </tr>
    </thead>
    <tbody>
        {{range .Expenses}}
        <tr>
            <td>{{.ID}}</td>
            <td>{{.Amount}}</td>
            <td>{{.Description}}</td>
            <td>{{.Date.Format "2006-01-02"}}</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<p>Пока нет ни одной траты. <a href="/expenses/new">Добавить первую</a>.</p>
{{end}}
{{end}}
