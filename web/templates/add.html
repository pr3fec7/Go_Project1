{{define "content"}}
<h2>Редактировать трату</h2>

<form method="POST" action="{{.Action}}">
    <input type="hidden" name="id" value="{{.ID}}">

    <label>
        Сумма:
        <input type="number" step="0.01" name="amount" required value="{{.Amount}}">
    </label>

    <label>
        Описание:
        <input type="text" name="description" required value="{{.Description}}">
    </label>

    <label>
        Категория:
        <select name="category_id">
            <option value="">— без категории —</option>
            {{range .Categories}}
                <option value="{{.ID}}" {{if eq .ID $.CategoryID}}selected{{end}}>{{.Name}}</option>
            {{end}}
        </select>
    </label>

    <label>
        Дата:
        <input type="date" name="date" required value="{{.Date}}">
    </label>

    <button type="submit">Сохранить</button>
</form>

<p><a href="/">← Назад к списку</a></p>
{{end}}
